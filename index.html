<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cadastro de Fichas</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  body {
    font-family: Arial, sans-serif;
    background-color: #f4f4f4;
    color: #333;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }
  .container {
    background-color: #fff;
    padding: 20px;
    border-radius: 8px;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
    width: 100%;
    max-width: 500px;
  }
  h1, h2 {
    text-align: center;
    margin-bottom: 15px;
  }
  form {
    display: flex;
    flex-direction: column;
    gap: 15px;
  }
  label {
    font-weight: bold;
  }
  input {
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 4px;
  }
  button.botao {
    padding: 10px;
    background-color: #4CAF50;
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
  }
  button.botao:hover {
    background-color: #45a049;
  }
  table.tabela {
    width: 100%;
    margin-top: 10px;
    border-collapse: collapse;
  }
  table.tabela th, table.tabela td {
    border: 1px solid #ccc;
    padding: 8px;
    text-align: center;
  }
  table.tabela th {
    background-color: #eee;
  }
</style>
</head>
<body>
  <div class="container">
    <h1>Cadastro de Fichas</h1>
    <form id="form">
      <label for="nome">Nome:</label>
      <input type="text" id="nome" name="nome" required />

      <label for="idade">Idade:</label>
      <input type="number" id="idade" name="idade" required />

      <label for="sangue">Tipo Sanguíneo:</label>
      <input type="text" id="sangue" name="sangue" required />

      <label for="escolaridade">Escolaridade:</label>
      <input type="text" id="escolaridade" name="escolaridade" required />

      <label for="altura">Altura (em metros):</label>
      <input type="number" step="0.01" id="altura" name="altura" required />

      <label for="peso">Peso (em kg):</label>
      <input type="number" step="0.1" id="peso" name="peso" required />

      <button type="submit" class="botao">Cadastrar</button>
    </form>

    <h2>Fichas Cadastradas</h2>
    <table class="tabela">
      <thead>
        <tr>
          <th>Nome</th>
          <th>Idade</th>
          <th>Tipo Sanguíneo</th>
          <th>Escolaridade</th>
          <th>Altura (m)</th>
          <th>Peso (kg)</th>
          <th>IMC</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

<script>
  const form = document.getElementById("form");
  const tabelaCorpo = document.querySelector(".tabela tbody");

  function calcularIMC(peso, altura) {
    return (peso / (altura * altura)).toFixed(2);
  }

  function adicionarFicha(event) {
    event.preventDefault();

    const nome = document.getElementById("nome").value.trim();
    const idade = document.getElementById("idade").value.trim();
    const sangue = document.getElementById("sangue").value.trim();
    const escolaridade = document.getElementById("escolaridade").value.trim();
    const altura = parseFloat(document.getElementById("altura").value);
    const peso = parseFloat(document.getElementById("peso").value);

    const imc = calcularIMC(peso, altura);

    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${nome}</td>
      <td>${idade}</td>
      <td>${sangue}</td>
      <td>${escolaridade}</td>
      <td>${altura.toFixed(2)}</td>
      <td>${peso.toFixed(1)}</td>
      <td>${imc}</td>
    `;

    tabelaCorpo.appendChild(tr);
    form.reset();
  }

  form.addEventListener("submit", adicionarFicha);
</script>
</body>
</html>
